# Whole system: `docker compose up --build`, then open http://localhost:8080
name: pollination
services:
  app:
    build:
      context: .
      args:
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-}
    env_file:
      - path: .env # optional Earthdata credentials (see README)
        required: false
    volumes:
      - nasa-cache:/app/.cache # NASA responses survive rebuilds (plan D2/D21)
    ports:
      - "${WEB_PORT:-8080}:8000" # map at /, API at /api (docs at /api/docs)
    restart: unless-stopped

volumes:
  nasa-cache:
