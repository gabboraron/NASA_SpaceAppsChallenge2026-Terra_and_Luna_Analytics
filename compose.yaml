# Whole system: `docker compose up --build`, then open http://localhost:8080
name: pollination
services:
  api:
    build: .
    env_file:
      - path: .env # optional Earthdata credentials (see README)
        required: false
    volumes:
      - nasa-cache:/app/.cache # NASA responses survive rebuilds (plan D2/D21)
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000" # API docs at /docs, host-local only
    restart: unless-stopped

  web:
    build:
      context: frontend
      args:
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-false}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nasa-cache:
