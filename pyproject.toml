[project]
name = "nasa-spaceapps-2026"
version = "0.1.0"
description = "NASA Space Apps Challenge 2026"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
required-version = ">=0.9"

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "pip-audit>=2.10.1",
    "commitizen>=4.19.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
# research/ holds throwaway feasibility prototypes, not product code
extend-exclude = ["research"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "SIM",      # simplify
  "C4",       # comprehensions
  "PL",       # pylint rules
  "ANN",      # type annotations required
  "D",        # docstrings
  "RUF",
  "PTH",      # pathlib
  "S",        # security
  "T20",      # no stray print()
]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "PLR2004"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
