name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Tests
        run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=80
      - name: Dependency vulnerability audit
        run: |
          uv export --locked --no-emit-project -o requirements.audit.txt
          uv run pip-audit -r requirements.audit.txt --require-hashes --disable-pip
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - name: Smoke test
        run: |
          docker compose up -d --wait
          curl -fsS http://localhost:8080/api/health
          curl -fsS -o /dev/null http://localhost:8080/api/parcels
          curl -fsS -o /dev/null http://localhost:8080/
      - if: always()
        run: docker compose down

  # Push to main -> image in Azure Container Registry -> Azure Container Apps.
  # One-time Azure setup and the repo variables it needs: docs/deploy_azure.md.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    needs: [check, frontend, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC login to Azure, no stored password
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      IMAGE: ${{ vars.AZURE_ACR }}.azurecr.io/happybee:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push the image
        run: |
          az acr login --name "${{ vars.AZURE_ACR }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Roll out
        run: |
          az containerapp update -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ vars.AZURE_CONTAINERAPP }}" --image "$IMAGE" -o none
      - name: Smoke test the live app
        run: |
          fqdn=$(az containerapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ vars.AZURE_CONTAINERAPP }}" --query properties.configuration.ingress.fqdn -o tsv)
          curl -fsS --retry 10 --retry-delay 10 --retry-all-errors "https://$fqdn/api/health"
          echo "Live: https://$fqdn" >> "$GITHUB_STEP_SUMMARY"
