<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t">
  <title id="t">HappyBee logo: a smiling bee on a honeycomb cell</title>
  <defs>
    <clipPath id="body"><ellipse cx="100" cy="114" rx="46" ry="50"/></clipPath>
  </defs>
  <!-- honeycomb cell -->
  <path d="M100 12 176 56v88l-76 44-76-44V56z" fill="#f0d898" stroke="#f0d898" stroke-width="16" stroke-linejoin="round"/>
  <g stroke="#1c1912" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- wings -->
    <ellipse cx="52" cy="88" rx="27" ry="17" transform="rotate(-35 52 88)" fill="#fcf8ec"/>
    <ellipse cx="148" cy="88" rx="27" ry="17" transform="rotate(35 148 88)" fill="#fcf8ec"/>
    <!-- stinger and antennae -->
    <path d="M93 160l7 16 7-16z" fill="#1c1912"/>
    <path d="M90 68q-3-18-14-23M110 68q3-18 14-23" fill="none"/>
    <!-- body with stripes -->
    <ellipse cx="100" cy="114" rx="46" ry="50" fill="#e3a92b"/>
    <g clip-path="url(#body)" stroke="none" fill="#1c1912">
      <rect x="50" y="130" width="100" height="11"/>
      <rect x="50" y="149" width="100" height="11"/>
    </g>
    <ellipse cx="100" cy="114" rx="46" ry="50" fill="none"/>
    <!-- smile -->
    <path d="M87 108q13 13 26 0" fill="none"/>
  </g>
  <circle cx="75" cy="44" r="5" fill="#1c1912"/>
  <circle cx="125" cy="44" r="5" fill="#1c1912"/>
  <!-- eyes and cheeks -->
  <circle cx="83" cy="96" r="6" fill="#1c1912"/>
  <circle cx="117" cy="96" r="6" fill="#1c1912"/>
  <circle cx="85" cy="94" r="2" fill="#fcf8ec"/>
  <circle cx="119" cy="94" r="2" fill="#fcf8ec"/>
  <circle cx="70" cy="110" r="6" fill="#e9806e" opacity=".75"/>
  <circle cx="130" cy="110" r="6" fill="#e9806e" opacity=".75"/>
</svg>
